name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Build and regressions (isolated example config)
        env:
          NODE_OPTIONS: --require=./scripts/deny-external-network.cjs
        run: |
          cp config.example.yaml config.yaml
          yarn build
          node scripts/test-security-patches.cjs
          node scripts/test-css-security.cjs
          node scripts/test-modern-build.cjs
          node scripts/test-dev-security.cjs
